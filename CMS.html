      <div class="mg-dateRow">${L('Start Date', fmtL(root.start))}${L('End Date', fmtL(root.end))}</div>${L('Budget Status', root.budget ? 'Yes' : 'No')}${L('Budget Code', esc(root.budgetCode || '—'))}${L('Renewable', yn(root.renewable))}${L('Extendable', yn(root.extendable))}${L('Auto Renewal', 'Off')}${L('Procurement Mode', ss ? 'Single Source' : 'Competitive Bidding')}${L('Recommended Vendor', esc(recV || '—'))}</div>
      ${root.description ? `<div class="mg-fgrid">${fi('Description', esc(root.description), 'area', true)}</div>` : ''}
      ${vens.length ? `<div class="mg-sdiv"><span>Vendor Details — Read Only</span></div>${vtable(true)}` : ''}
      ${root.justification ? `<div class="mg-fgrid">${fi('Recommendation Justification', esc(root.justification), 'area', true)}</div>` : ''}`;
    body += sec('Editable Fields') + grid((k === 'renew' ? eDate('New Effective Date', 'mg_ns', 'start') + eDate('New End Date', 'mg_ne', 'end') : k === 'cancel' ? eDate('New End Date', 'mg_ne', 'end') : k === 'compl' ? eDate('Completion Date', 'mg_ne', 'end') : '')
      + eDate('Actual Start Date', 'mg_as', 'actualStart', true) + eDate('Actual End Date', 'mg_ae', 'actualEnd', true) + eNotice());
    if (k === 'cancel' && (ed || v.cancelJust)) body += ed ? area('Cancellation Justification', 'mg_cj', v.cancelJust) : `<div class="mg-fgrid">${area('Cancellation Justification', 'mg_cj', v.cancelJust)}</div>`;
  }
  const PEN = '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  return `<div class="mg-secHdr mg-sticky">${MG_SEC[k]}${editable ? `<div class="mg-secAct">${ed ? `<button class="mg-btnCancel" onclick="ST.mEdit=null;render()">Cancel</button><button class="mg-btnSave" onclick="mvSave('${v.id}')">Save</button>` : `<button class="mg-btnEdit" onclick="ST.mEdit='${v.id}';render()">${PEN}Edit</button>`}</div>` : ''}</div>${body}${mgDocs(v)}`;
}
function mvSave(id) {
  const c = byId(id), g = f => { const e = $('#' + f); return e ? e.value : null; };
  const as = g('mg_as'), ae = g('mg_ae');
  if (!as || !ae) { toast(!as ? 'Actual Start Date is required.' : 'Actual End Date is required.', true); return; }
  if (ae < as) { toast('Actual End Date must be on or after the Actual Start Date.', true); return; }
  if (g('mg_val') !== null) c.value = Number(g('mg_val')) || c.value;
  if (g('mg_not') !== null) c.notice = Number(g('mg_not')) || c.notice;
  if (g('mg_ns')) c.start = g('mg_ns'); if (g('mg_ne')) c.end = g('mg_ne');
  if (g('mg_desc') !== null) c.description = g('mg_desc'); if (g('mg_rj') !== null) c.justification = g('mg_rj'); if (g('mg_cj') !== null) c.cancelJust = g('mg_cj');
  c.actualStart = as; c.actualEnd = ae; ST.mEdit = null; toast('Contract updated successfully'); render();
}
function mChainBar(c, w) { return w ? `<div class="m-chain">${pdChain(c, w)}</div>` : ''; }
function mgCaption(s) { return s.status === 'Approved' ? 'Approved' : s.status === 'Rejected' ? 'Rejected' : /change/i.test(s.status) ? 'Change Requested' : s.status === 'Pending' ? 'Due: ' + fmtL(s.assignedOn + APPROVAL_TEMPLATE.dueDays * DAY) : 'After prev. approval'; }
function mgDot(s) { return s.status === 'Approved' ? ['dotDone', 'csDone', '✓'] : s.status === 'Rejected' ? ['dotRej', 'csRej', '✕'] : /change/i.test(s.status) ? ['dotChg', 'csChg', ''] : s.status === 'Pending' ? ['dotAct', 'csAct', ''] : ['dotPend', 'csPend', '']; }
function pgMigrated(id) {
  const c0 = byId(id); if (!c0) return pageHead('Migrated Contract Details') + '<div class="page"><div class="empty">Not found.</div></div>';
  const c = latestOf(c0), w = curCycle(c, 'contract'), st = status(c);

  const sel = byId(ST.tab['mv' + c.cid]) && vs.includes(byId(ST.tab['mv' + c.cid])) ? byId(ST.tab['mv' + c.cid]) : vs[0];
  const editable = ['Draft', 'Request for Change'].includes(c.stage);
  const canStart = editable;
  const comments = []; if (sel === c) c.cycles.forEach(x => x.steps.forEach(s => { if (s.actedOn && s.comments && s.user !== c.requester) comments.push({ who: s.user, at: s.actedOn, text: s.comments }); }));
  comments.sort((a, b) => b.at - a.at);
  const lp = (l, v, b) => `<div class="mg-lpField"><label>${l}</label>${v === null ? '<span>—</span>' : b === 'dept' ? `<span class="mg-deptBadge">${v}</span>` : `<span class="${b ? 'bold' : ''}">${v}</span>`}</div>`;
  const CHK = '<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
  const CLK = '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
  const SHD = '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>';
  const chain = w ? `<div class="mg-chainBar"><div class="mg-chainTitle">Approval Chain</div><div class="mg-chainRow"><div class="mg-hStep done"><div class="mg-hDot dotDone">✓</div><div class="mg-hName">Submitted by</div><div class="mg-hSub">${esc(P(c.requester).name)}</div><div class="mg-hStatus csDone">${fmtL(w.submittedOn)}</div></div>
      ${w.steps.map((s, i) => { const d = mgDot(s); return `<div class="mg-hStep ${s.status === 'Approved' ? 'done' : ''}"><div class="mg-hDot ${d[0]}">${d[2] || i + 1}</div><div class="mg-hName">Step ${i + 1}</div><div class="mg-hSub">${esc(P(s.user).name)}</div><div class="mg-hStatus ${d[1]}">${mgCaption(s)}</div></div>`; }).join('')}</div></div>` : '';
  return `<div class="mg-page"><div class="mg-topbar"><div class="mg-tl"><button class="mg-back" onclick="go(ST.mgFrom || '#/import')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>Back</button>
      <div style="min-width:0"><div class="mg-title">Migrated Contract Details</div><div class="mg-sub">${esc(c.cid)} &nbsp;·&nbsp; ${esc(c.title)} &nbsp;·&nbsp; ${esc(c.type)}</div></div></div>
      <div class="mg-tr">${badge(st)}${canStart ? `<button class="mg-btnStart" onclick="startMigrated('${c.id}')">${CHK}Start Approval</button>` : ''}<button class="mg-btnRef" title="View approval history" onclick="prevApprovals('${c.id}')">${CLK}Approval History</button>${w && w.status === 'Approved' ? `<button class="mg-btnRef" title="View approval certificate" onclick="certificate('${c.id}')">${SHD}View Certificate</button>` : ''}<button class="mg-btnRef" title="Refresh contract data" ${ST.mEdit ? 'disabled' : ''} onclick="render()">${MG_REF}Refresh</button></div></div>
    ${chain}
    <div class="mg-layout"><div class="mg-left"><div class="mg-lpTitle">Contract Overview</div>${lp('Reference No.', esc(c.cid), 1)}${lp('Contract Name', esc(c.title), 1)}${lp('Contract Type', esc(c.type))}${lp('Vendor Name', esc(c.vendor || '—'))}${lp('Branch', esc(c.branch))}${lp('Department', c.dept ? esc(c.dept) : null, 'dept')}</div>
      <div class="mg-centre"><div class="mg-revTabs">${vs.map(v => { const k = MG_KIND(v.requestType); return `<button class="mg-revTab ${v === sel ? 'active' : ''}" onclick="ST.tab['mv${c.cid}']='${v.id}';ST.mEdit=null;render()"><span class="mg-revHead"><span class="mg-tp ${MG_PCLS[k]}">${MG_PILL[k]}</span>${k === 'new' ? 'Initial Contract' : ''}${v === vs[0] ? '<span class="mg-tp tpLatest">Current</span>' : ''}</span>${v.actualStart || v.actualEnd ? `<span class="mg-revDates">${fmtL(v.actualStart)} → ${fmtL(v.actualEnd)}</span>` : ''}</button>`; }).join('')}</div>
        <div class="mg-centreBody">${mgRevision(sel, root, editable)}</div></div>

}
function startMigrated(id) {
  const c = byId(id), t = templateFor(c.branch, c.dept), n = ST.contracts.filter(x => x.cid === c.cid).length;
  modal('Start Contract Approval', `<div class="ax-head"><div><small>Whole contract · ${n} version${n > 1 ? 's' : ''} · mapped for ${esc(c.dept)}, ${esc(c.branch)}</small><b>${esc(t.name)}</b></div><span class="ap-type seq">Sequential</span></div>${approverPreview(c, t)}`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="go('#/migrated/${id}');sendDoc('${id}','contract','${t.id}',true)">Start Now</button>`, true);
}
function pgMigratedApprove(id) {
  const c = latestOf(byId(id)), w = curCycle(c, 'contract'), my = w && w.status === 'In Progress' && w.steps.find(s => s.status === 'Pending' && s.user === ST.user);
  const comments = []; c.cycles.forEach(x => x.steps.forEach(s => { if (s.actedOn && s.comments) comments.push({ who: s.user, at: s.actedOn, text: s.comments, tag: s.status }); })); (c.notes || []).forEach(n => comments.push(n)); comments.sort((a, b) => b.at - a.at);

  return `<div class="as"><div class="as-top"><div class="as-tl"><button class="as-back" onclick="apBack('${c.id}')">← Back</button><div><b>Migrated Contract — Approval ${my ? 'Review' : 'View'}</b><small>${esc(c.cid)} · ${esc(c.title)}</small></div></div>
      <div class="as-tr as-btns">${w && w.status === 'Approved' ? `<button class="btn sm" onclick="certificate('${c.id}')">View Certificate</button>` : ''}${my ? `<button class="as-rej" onclick="decideAsk('${c.id}','Rejected','contract')">Reject</button><button class="as-rfc" onclick="decideAsk('${c.id}','Request for Change','contract')">Request Change</button><button class="as-ok" onclick="decideAsk('${c.id}','Approved','contract')">Approve</button>` : badge(w ? (w.status === 'In Progress' ? 'In Approval' : w.status) : c.stage)}</div></div>

      <main class="as-mid" style="padding-top:18px">${versionPanel(c, false)}</main>
      ${commentBox(c, c.cid, comments)}</div></div>`;
