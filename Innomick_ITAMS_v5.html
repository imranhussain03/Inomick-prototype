/* No global border-box: SharePoint leaves divs as content-box (only buttons/selects/inputs are border-box), and the dev layout depends on it. */
*{margin:0;padding:0;}
.spSuite *,.pp,.pp *,.panel,.panel *,.dlg,.dlg *,.pickerMenu *,.msgInfo,.msgErr{box-sizing:border-box;}
html,body,#root{width:100%;height:100%;}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;background:#fff;overflow:hidden;}
input,select,textarea,button{font-family:inherit;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
@keyframes panelIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Prototype-only additions ── */
.shell{display:flex;flex-direction:column;height:100vh;background:#fff;}
/* SharePoint chrome replica (measured on IAMS-Dev at 100% zoom) */
.spSuite{height:48px;flex-shrink:0;background:#0078d4;color:#fff;display:flex;align-items:center;position:relative;z-index:60;}
.spBtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex-shrink:0;}
.spBtn:hover{background:rgba(0,0,0,.12);}
.spBrand{font-size:16px;font-weight:600;line-height:48px;margin-left:8px;white-space:nowrap;}
.spSearch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:392px;height:32px;background:#fafafa;border-radius:4px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#605e5c;font-size:14px;}
.spRight{margin-left:auto;display:flex;position:relative;}
.spMeAv{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;}
.spPage{flex:1;min-height:0;display:flex;margin:0;background:#fff;overflow:hidden;}
.spScroll{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;}
/* Prototype-only demo control */
.demoFab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:900;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 18px;border-radius:18px;border:1px solid var(--ash-primary-dark);background:var(--ash-primary);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.demoFab:hover{background:var(--ash-primary-dark);}
.main>section,.main>div{animation:fadeIn .3s;}
.spinner{width:28px;height:28px;border:3px solid var(--ash-primary-light);border-top-color:var(--ash-primary);border-radius:50%;animation:spin .8s linear infinite;}
.msgErr{background:#fde7e9;color:#a4262c;font-size:13px;padding:8px 12px;border-radius:4px;margin-bottom:12px;}
.msgInfo{background:#f3f9fd;border:1px solid #c7e0f4;color:#323130;font-size:13px;padding:10px 12px;border-radius:6px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pp{border:1px solid var(--ash-border);border-radius:6px;background:#fff;min-height:36px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:3px 6px;position:relative;}
.pp input{border:0;outline:none;font-size:13px;flex:1;min-width:120px;padding:4px;color:var(--ash-text);}
.ppChip{display:inline-flex;align-items:center;gap:6px;background:#f3f2f1;border-radius:14px;padding:2px 4px 2px 2px;font-size:13px;color:#323130;}
.ppAv{width:24px;height:24px;border-radius:50%;background:var(--ash-primary);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ppX{border:0;background:transparent;cursor:pointer;color:#605e5c;width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;}
.ppX:hover{background:#e1dfdd;}
.ppSug{position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.13),0 1px 4px rgba(0,0,0,.11);border-radius:2px;z-index:50;max-height:260px;overflow:auto;}
.ppSugHead{font-size:12px;color:#605e5c;padding:8px 12px;border-bottom:1px solid #edebe9;}
.ppSugItem{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;}
.ppSugItem:hover{background:#f3f2f1;}
.ppSugName{font-size:14px;color:#323130;}
.ppSugSub{font-size:12px;color:#605e5c;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;}
.panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:100%;background:#fff;box-shadow:0 25.6px 57.6px rgba(0,0,0,.22),0 4.8px 14.4px rgba(0,0,0,.18);z-index:1001;display:flex;flex-direction:column;animation:panelIn .2s ease-out;}
.panelHead{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 0;}
.panelTitle{font-size:20px;font-weight:600;color:#323130;}
.panelBody{flex:1;overflow:auto;padding:0 24px 20px;}
.panelFoot{padding:16px 24px;border-top:1px solid #edebe9;}
.fLabel{font-size:14px;font-weight:600;color:#323130;padding:5px 0;display:block;}
.fLabel .r{color:#a4262c;padding-left:2px;}
.fInput{width:100%;height:32px;border:1px solid #8a8886;border-radius:2px;padding:0 8px;font-size:14px;color:#323130;outline:none;}
.fInput:focus{border:2px solid var(--ash-primary);padding:0 7px;}
.fBtn{height:32px;min-width:80px;padding:0 16px;border-radius:2px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #8a8886;background:#fff;color:#323130;}
.fBtn:hover{background:#f3f2f1;}
.fBtnP{background:var(--ash-primary);border-color:var(--ash-primary);color:#fff;}
.fBtnP:hover{background:var(--ash-primary-dark);}
.fBtn:disabled{opacity:.5;cursor:not-allowed;}
.tgl{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:#323130;user-select:none;}
.tglTrack{width:40px;height:20px;border-radius:10px;border:1px solid #605e5c;position:relative;transition:all .15s;}
.tglThumb{position:absolute;top:3px;left:4px;width:12px;height:12px;border-radius:50%;background:#605e5c;transition:all .15s;}
.tgl.on .tglTrack{background:var(--ash-primary);border-color:var(--ash-primary);}
.tgl.on .tglThumb{left:22px;background:#fff;}
.dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:340px;max-width:calc(100% - 32px);background:#fff;box-shadow:0 25.6px 57.6px rgba(0,0,0,.22);z-index:1001;padding:24px;border-radius:2px;}
.dlgTitle{font-size:20px;font-weight:600;color:#323130;margin-bottom:16px;}
